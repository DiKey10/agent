<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rolki → Przepisy{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Rolki<span>→</span>Przepisy</a>
    <form class="search" action="/" method="get">
      <input type="search" name="q" placeholder="Szukaj w przepisach…" value="{{ q|default('') }}">
    </form>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
