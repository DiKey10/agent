[project]
name = "rolki-przepisy"
version = "0.1.0"
description = "Zamienia rolki z gotowaniem na uporządkowane przepisy po polsku"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "anthropic>=0.69",
    "yt-dlp>=2024.12.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Lokalna transkrypcja audio (darmowa, offline). Wymaga ffmpeg w systemie.
whisper = ["faster-whisper>=1.1.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
rolki = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
